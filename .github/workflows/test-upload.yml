name: Test streaming uploads

on:
  push:
    paths:
      - python/**
      - action.yml
      - .github/workflows/test-upload.yml
  pull_request:
    paths:
      - python/**
      - action.yml
      - .github/workflows/test-upload.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uploader dependencies
        run: python -m pip install -r python/requirements.txt
      - name: Verify streaming uploads without external services
        run: python -B -m unittest discover -s python -p 'test_*.py' -v
